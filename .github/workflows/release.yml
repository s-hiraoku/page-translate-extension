name: Release

on:
  push:
    tags:
      - "v*"
  # Manual release: builds the chosen ref and creates the v<version> tag and
  # GitHub Release from package.json, so no local tag push is needed.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to release (the version comes from its package.json)"
        required: true
        default: main

permissions:
  contents: write

jobs:
  release:
    name: Publish store zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # README: Node.js 20.19+ or 22.12+
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Package store zip
        run: npm run zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(.output/page-translate-v*-chrome.zip)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "Expected exactly one store zip, found ${#files[@]}" >&2
            exit 1
          fi
          zip="${files[0]}"
          base="$(basename "$zip")"
          pkg="$(node --input-type=commonjs -p "require('./package.json').version")"
          expected="page-translate-v${pkg}-chrome.zip"
          if [[ "$base" != "$expected" ]]; then
            echo "package.json version ${pkg} does not match ${base}. Align package.json with src/manifest.ts before releasing." >&2
            exit 1
          fi
          tag="v${pkg}"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Never move or reuse an existing tag: a version is released once.
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              echo "Tag ${tag} already exists. Bump the version in package.json and src/manifest.ts first." >&2
              exit 1
            fi
            # Creates the tag at the built commit. Tags made with GITHUB_TOKEN do not
            # trigger the tag-push run of this workflow, so the release is made once.
            gh release create "$tag" "$zip" \
              --target "$(git rev-parse HEAD)" \
              --title "$tag" \
              --notes "Chrome ウェブストア提出用の ${base} です。"
          else
            if [[ "$GITHUB_REF_NAME" != "$tag" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${tag}." >&2
              exit 1
            fi
            gh release create "$tag" "$zip" \
              --title "$tag" \
              --notes "Chrome ウェブストア提出用の ${base} です。"
          fi
